# Copy to config.yaml. Docker Compose loads the variables from .env.
listen:
  - "${DNS_LISTEN_IP}:53"
allow:
  - "${DNS_ALLOW_CIDR}"
upstream: "${DNS_UPSTREAM}"
ttl: 60

rules:
  # Return the IPv4 address of your revival server for these names.
  - service: example-game
    names:
      - login.example.com
      - "*.lobby.example.com"
    answer: "192.0.2.10"

  # Optional: send matching queries to a different DNS resolver.
  # - service: example-forwarder
  #   names:
  #     - "*.auth.example.com"
  #   forward: "192.0.2.54"
